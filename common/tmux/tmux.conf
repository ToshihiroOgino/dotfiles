# Shared tmux config (tmux-compatible syntax; loaded on both real tmux and psmux)

set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g history-limit 10000
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1

# tmux 3.x / psmux default status-right, plus an IME indicator (see tools/imestat).
# A resident watcher pushes the mode into @ime only when it changes.
# if-shell fails quietly where imestat is unsupported or not installed,
# so the indicator just stays empty there.
if-shell 'imestat' "run-shell -b 'imestat --watch'"
set -g status-right-length 50
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#{@ime} "#{=21:pane_title}" %H:%M %d-%b-%y'

# vim-style pane navigation: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
