# Shared tmux config (tmux-compatible syntax; loaded on both real tmux and psmux)

set -g mouse on
set -sg escape-time 10
set -g focus-events on
# Pass modified keys (e.g. Shift+Enter in Claude Code) through to the app.
set -s extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys'
set -g history-limit 10000
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set -g status-position top
set -g mode-keys vi

if-shell '$HOME/dotfiles/tools/ime/ime' "run-shell -b '$HOME/dotfiles/tools/ime/ime watch'"
# Switch the IME to alphanumeric while the prefix table is active, then restore it.
# `prefix` is None because tmux handles the prefix key before root-table bindings.
set -g prefix None
bind C-b send-keys C-b
bind -n C-b run-shell -b '$HOME/dotfiles/tools/ime/ime prefix "#{client_name}"' \; switch-client -T prefix
set -g status-right-length 50
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#{@ime} "#{=21:pane_title}" %H:%M %d-%b-%y'

# vim-style pane navigation: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

source-file -q ~/.tmux.local.conf
