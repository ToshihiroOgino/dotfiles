set -g mouse on
# 非アクティブpaneのクリックはフォーカス移動のみ
bind -n MouseDown1Pane if -F '#{pane_active}' { send-keys -M } { select-pane -t= }
set -sg escape-time 10
set -g focus-events on
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys'
# let apps (nvim) set the outer clipboard through OSC 52
set -g set-clipboard on
set -g history-limit 10000
set -g history-file ~/.tmux_history
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set -g status-position bottom
set -g mode-keys vi

# Claude Code state per pane (scripts/claude-tmux-state.sh, linked by make link-tmux): ◐ working / ○ waiting / ✓ done / ● seen
%hidden CLAUDE_STATE="$HOME/.local/bin/claude-tmux-state"
%hidden CLAUDE_ICONS="#{P:#{?#{@claude_icon}, #{@claude_icon},}}"
set -g @catppuccin_window_text " #W${CLAUDE_ICONS}#{?window_zoomed_flag, 󰁌,}"
set -g @catppuccin_window_current_text " #W${CLAUDE_ICONS}#{?window_zoomed_flag, 󰁌,}"
set-hook -gw window-pane-changed "run-shell -b '${CLAUDE_STATE} seen #{pane_id}'"
set-hook -g session-window-changed "run-shell -b '${CLAUDE_STATE} seen #{pane_id}'"
set-hook -g client-session-changed "run-shell -b '${CLAUDE_STATE} seen #{pane_id}'"
set-hook -g client-focus-in "run-shell -b '${CLAUDE_STATE} seen #{pane_id}'"

# IME Utility (tools/ime): enabled only when `ime get` works here; otherwise the default C-b prefix stays.
if-shell '$HOME/.local/bin/ime get' {
  run-shell -b '$HOME/.local/bin/ime watch'
  set -g prefix None
  bind C-b send-keys C-b
  bind -n C-b run-shell -b '$HOME/.local/bin/ime prefix "#{client_name}"' \; switch-client -T prefix
}
set -g status-right-length 60
set -g status-right '#{?#{==:#{client_key_table},prefix},#[bg=colour214 fg=colour16 bold] PREFIX #[default],        }#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#{@ime} "#{=21:pane_title}" %H:%M %d-%b-%y'

# vim-style pane navigation: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# swap the current pane with its neighbour: prefix + H/J/K/L
bind H swap-pane -t '{left-of}'
bind J swap-pane -t '{down-of}'
bind K swap-pane -t '{up-of}'
bind L swap-pane -t '{right-of}'

# new panes/windows inherit the cwd of the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind v run-shell 'y=$(command -v win32yank.exe || ls /mnt/c/Users/*/scoop/shims/win32yank.exe 2>/dev/null | head -n1); if [ -n "$y" ]; then "$y" -o --lf | tmux load-buffer -b win32yank - && tmux paste-buffer -d -p -b win32yank -t "#{pane_id}"; else tmux display-message -d 3000 "win32yank.exe not found"; fi'

source-file -q ~/.tmux.local.conf

# plugins (tpm): install with prefix + I. Keep this at the bottom.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'
if-shell '[ -f ~/.tmux/plugins/tpm/tpm ]' "run '~/.tmux/plugins/tpm/tpm'"
