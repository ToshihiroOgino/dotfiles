set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -s extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys'
# let apps (nvim) set the outer clipboard through OSC 52
set -g set-clipboard on
set -g history-limit 10000
set -g history-file ~/.tmux_history
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set -g status-position bottom
set -g status-style 'bg=#3d2200,fg=colour252'
set -g window-status-current-style 'fg=colour231,bold'
set -g mode-keys vi

# Claude Code state per pane (tools/claude-tmux-state): ◐ working / ○ waiting / ✓ done / ● seen
set -g window-status-format '#I:#W#{P:#{?#{@claude_icon}, #{@claude_icon},}}'
set -g window-status-current-format '#I:#W#{P:#{?#{@claude_icon}, #{@claude_icon},}}'
set-hook -gw window-pane-changed "run-shell -b '$HOME/dotfiles/tools/claude-tmux-state seen #{pane_id}'"
set-hook -g session-window-changed "run-shell -b '$HOME/dotfiles/tools/claude-tmux-state seen #{pane_id}'"
set-hook -g client-session-changed "run-shell -b '$HOME/dotfiles/tools/claude-tmux-state seen #{pane_id}'"
set-hook -g client-focus-in "run-shell -b '$HOME/dotfiles/tools/claude-tmux-state seen #{pane_id}'"

# IME Utitility
if-shell '$HOME/dotfiles/tools/ime/ime' "run-shell -b '$HOME/dotfiles/tools/ime/ime watch'"
set -g prefix None
bind C-b send-keys C-b
bind -n C-b run-shell -b '$HOME/dotfiles/tools/ime/ime prefix "#{client_name}"' \; switch-client -T prefix
set -g status-right-length 60
set -g status-right '#{?#{==:#{client_key_table},prefix},#[bg=colour214 fg=colour16 bold] PREFIX #[default],        }#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#{@ime} "#{=21:pane_title}" %H:%M %d-%b-%y'

# vim-style pane navigation: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# swap the current pane with its neighbour: prefix + H/J/K/L
bind H swap-pane -t '{left-of}'
bind J swap-pane -t '{down-of}'
bind K swap-pane -t '{up-of}'
bind L swap-pane -t '{right-of}'

source-file -q ~/.tmux.local.conf
