# plugins (ppm): install with prefix + I.
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'ToshihiroOgino/imectl'
set -g @plugin 'psmux-plugins/psmux-theme-catppuccin'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @plugin 'psmux-plugins/psmux-continuum'
set -g @continuum-save-interval '1'

source-file ~/.tmux.common.conf
bind H swap-pane -L
bind J swap-pane -D
bind K swap-pane -U
bind L swap-pane -R

set -g window-status-format "#[fg=#585b70]  #I #W#{P:#{?#{@claude_icon}, #{@claude_icon},}}#[fg=#585b70]#{?window_flags, #{window_flags},}  "
set -g window-status-current-format "#[fg=#a6e3a1,bg=#1e1e2e]▌#[bg=#a6e3a1,fg=#11111b,bold] #I #W#{P:#{?#{@claude_icon}, #{@claude_icon},}}#[fg=#11111b]#{?window_flags, #{window_flags},} #[fg=#a6e3a1,bg=#1e1e2e]▌"
set-hook -g after-select-pane "run-shell -b '~/.local/bin/claude-tmux-state.exe seen #{pane_id}'"
set-hook -g after-select-window "run-shell -b '~/.local/bin/claude-tmux-state.exe seen #{pane_id}'"
set-hook -g client-session-changed "run-shell -b '~/.local/bin/claude-tmux-state.exe seen #{pane_id}'"
set-hook -g pane-focus-in "run-shell -b '~/.local/bin/claude-tmux-state.exe seen #{pane_id}'"
source-file ~/.tmux.local.conf

run '~/.psmux/plugins/ppm/ppm.ps1'
source-file ~/.psmux/plugins/ppm/plugin.conf
