set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g allow-passthrough on
# let apps (nvim) set the outer clipboard through OSC 52
set -g set-clipboard on
set -g history-limit 10000
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set -g status-position bottom
set -g mode-keys vi

set -g status-right-length 60
set -g status-right '#{?#{==:#{client_key_table},prefix},#[bg=colour214 fg=colour16 bold] PREFIX #[default],        }#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#{@imectl} "#{=21:pane_title}" %H:%M %d-%b-%y'

# vim-style pane navigation: prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# swap the current window with its neighbour: prefix + C-h/C-l
bind -r C-h swap-window -t -1
bind -r C-l swap-window -t +1

# new panes/windows inherit the cwd of the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
