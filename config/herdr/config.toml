onboarding = false

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true

[ui]
status_indicators = "symbols"
redraw_on_focus_gained = true
mouse_capture = true
tab_bar_right = [
  { type = "command", command = "$HOME/dotfiles/tools/ime/ime", interval_seconds = 1, timeout_seconds = 1 },
  { type = "datetime", format = "%m/%d %H:%M" },
]
tab_bar_right_separator = " "

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "herdr pane swap --current --direction up"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "herdr pane swap --current --direction down"

[theme]
name = "catppuccin"
auto_switch = false
